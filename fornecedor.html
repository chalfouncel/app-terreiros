<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Fornecedor Parceiro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
#painelFornecedorAtivo { padding-bottom:110px; }
.portal-selecionar {display:none;}
.modo-lote .portal-selecionar {display:inline-flex;align-items:center;gap:8px;font-size:12px;color:#a5b4fc;flex-shrink:0;}
.portal-linha.selecionado {background:#1e293b;outline:1px solid #818cf8;outline-offset:-1px;}
.portal-linha label {flex-wrap:wrap;}

#painelFornecedorAtivo input:not([type=checkbox]),#painelFornecedorAtivo select,#painelFornecedorAtivo textarea {font-size:16px;min-height:44px;}
#painelFornecedorAtivo button {min-height:44px;font-size:14px;}
#painelFornecedorAtivo input[type=checkbox] {width:20px;height:20px;accent-color:#10b981;flex-shrink:0;}
.portal-grupo {border:1px solid #334155;border-radius:14px;margin-bottom:12px;overflow:hidden;}
.portal-grupo summary {padding:16px;background:#1e293b;cursor:pointer;font-weight:700;}
.portal-linha {padding:16px;border-top:1px solid #334155;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;}
.portal-linha.editado {box-shadow:inset 3px 0 #fbbf24;}
.portal-nome {font-size:14px;font-weight:600;overflow-wrap:anywhere;}
.portal-meta {font-size:12px;color:#94a3b8;margin-top:4px;}
.portal-campos {display:flex;gap:14px;align-items:center;}
.portal-preco {width:112px;padding:10px;border:1px solid #475569;border-radius:10px;background:#0f172a;color:#fbbf24;text-align:right;}
.portal-toolbar {display:grid;grid-template-columns:2fr 1fr;gap:10px;}
.portal-toolbar input,.portal-toolbar select,.portal-lote input,.portal-lote select {width:100%;background:#1e293b;border:1px solid #475569;border-radius:10px;padding:10px;color:#fff;}
.portal-lote {display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding:12px 0;}
.portal-lote label {flex:1 1 110px;font-size:12px;}
.portal-lote button {background:#334155;border-radius:10px;padding:10px;}
.portal-salvar {position:fixed;bottom:0;left:0;right:0;z-index:30;background:#0f172af5;border-top:1px solid #334155;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;justify-content:center;}
.portal-salvar button {max-width:300px;margin:0!important;}
.portal-salvar p {font-size:12px;color:#cbd5e1;max-width:200px;}
#painelFornecedorAtivo [hidden] {display:none!important;}
#painelFornecedorAtivo button:disabled {opacity:.5;cursor:not-allowed;}
@media(max-width:540px){.portal-linha{grid-template-columns:1fr;gap:10px}.portal-campos{justify-content:space-between}.portal-toolbar{grid-template-columns:1fr}.portal-salvar{gap:8px}.portal-salvar p{max-width:120px}}
</style></head>
<body class="min-h-screen bg-slate-950 text-slate-100 p-4 flex flex-col items-center">

    <!-- TELA DE LOGIN DO FORNECEDOR -->
    <div id="telaLoginFornecedor" class="w-full max-w-sm mt-12 bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-4">
        <div class="text-center space-y-1">
            <div class="w-14 h-14 rounded-2xl bg-amber-500/20 text-amber-400 flex items-center justify-center mx-auto text-2xl border border-amber-500/30">
                <i class="fas fa-truck-loading"></i>
            </div>
            <h1 class="text-lg font-black uppercase text-white pt-2">Portal do Fornecedor</h1>
            <p class="text-xs text-slate-400">Atualize preços, horários, avisos de entrega e frete para os Terreiros</p>
        </div>

        <form id="formLoginFornecedor" class="space-y-3">
            <div>
                <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">WhatsApp Cadastrado</label>
                <input type="tel" id="loginFornWhats" required placeholder="(21) 99999-9999" class="w-full px-3.5 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-sm text-white outline-none focus:border-amber-500">
            </div>
            <div>
                <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">PIN de Acesso (6 dígitos)</label>
                <input type="password" id="loginFornPin" required maxlength="6" placeholder="******" class="w-full px-3.5 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-center font-mono text-base text-white outline-none focus:border-amber-500">
            </div>
            <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-xl text-xs uppercase tracking-wider shadow active:scale-95 transition">
                Entrar no Painel
            </button>
        </form>
    </div>

    <!-- PAINEL DE TABELA DE PREÇOS E FRETE DO FORNECEDOR -->
    <div id="painelFornecedorAtivo" class="hidden w-full max-w-4xl mt-4 space-y-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
            <div class="flex justify-between items-center">
                <div>
                    <span class="text-[10px] font-bold text-amber-400 uppercase">Fornecedor Parceiro</span>
                    <h2 id="nomeFornecedorLogado" class="text-base font-black text-white"></h2>
                </div>
                <button type="button" onclick="if(!portalAlterado() || confirm('Sair sem salvar as alterações?')) location.reload()" class="text-xs text-rose-400 font-bold bg-rose-500/10 px-3 py-1.5 rounded-xl border border-rose-500/20">Sair</button>
            </div>

            <div class="pt-3 border-t border-slate-800 space-y-3">
                <!-- BOTÃO / TOGGLE ACEITA PEDIDO 24HS -->
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 bg-slate-800/90 border border-slate-700 p-3 rounded-xl">
                    <div>
                        <span class="text-xs font-black text-emerald-400 uppercase flex items-center gap-1.5">
                            <i class="fas fa-bolt"></i> Aceita pedido 24hs
                        </span>
                        <p class="text-[10px] text-slate-400">Se desmarcado, o aplicativo bloqueará compras fora do horário definido abaixo.</p>
                    </div>
                    <label class="inline-flex items-center gap-2 cursor-pointer shrink-0 bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700">
                        <input type="checkbox" id="chkAceita24hForn" onchange="alternarModo24hFornecedor()" class="w-4 h-4 accent-emerald-500 rounded cursor-pointer" checked>
                        <span class="text-xs font-bold text-white" id="lblStatus24hForn">Ativado (24h)</span>
                    </label>
                </div>

                <!-- HORÁRIOS DE FUNCIONAMENTO (SÓ APARECE SE DESMARCAR 24HS) -->
                <div id="boxHorariosRestritosForn" class="hidden grid grid-cols-2 gap-3 bg-slate-950/60 p-3 rounded-xl border border-slate-800">
                    <div>
                        <label class="block text-[10px] font-bold text-emerald-400 uppercase mb-1"><i class="far fa-clock mr-1"></i> Abre às (Libera Pagto)</label>
                        <input type="time" id="inputHoraAberturaForn" value="08:00" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-xs font-bold text-white outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-rose-400 uppercase mb-1"><i class="fas fa-lock mr-1"></i> Fecha às (Bloqueia Pagto)</label>
                        <input type="time" id="inputHoraFechamentoForn" value="18:00" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-xs font-bold text-white outline-none focus:border-amber-500">
                    </div>
                </div>

                <!-- AVISO SOBRE HORÁRIOS DE ENTREGA EM DESTAQUE -->
                <div>
                    <label class="block text-[10px] font-black text-amber-400 uppercase mb-1">
                        <i class="fas fa-bullhorn mr-1"></i> Aviso sobre Horários de Entrega / Condições (Aparece em destaque para o cliente antes do pagamento)
                    </label>
                    <textarea id="inputAvisoEntregaFornecedor" rows="2" maxlength="220" placeholder="Ex: Entregas de Seg a Sex das 09h às 17h. Pedidos feitos à noite ou fim de semana serão entregues no próximo dia útil." class="w-full px-3 py-2 bg-slate-800 border border-amber-500/40 rounded-xl text-xs text-amber-100 outline-none focus:border-amber-400"></textarea>
                </div>
            </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
            <label class="block text-xs font-black text-indigo-300 uppercase"><i class="fas fa-synagogue mr-1"></i> 1. Selecione o Terreiro para atualizar preços e frete:</label>
            <select id="selectTerreiroFornecedor" onchange="carregarItensTerreiroFornecedor()" class="w-full px-3 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-sm font-bold text-white outline-none"></select>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Taxa de Entrega p/ este Terreiro (R$)</label>
                    <input type="number" step="0.01" id="inputFreteTerreiro" placeholder="Ex: 15.00" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-sm font-bold text-emerald-400 outline-none">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Frete Grátis acima de (R$ - Opcional)</label>
                    <input type="number" step="0.01" id="inputFreteGratisTerreiro" placeholder="Ex: 150.00" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-sm font-bold text-amber-300 outline-none">
                </div>
            </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
            <h3 class="text-xs font-black text-amber-400 uppercase"><i class="fas fa-tags mr-1"></i> 2. Lista de Doações do Terreiro (Informe seu Preço Unitário)</h3>
            <div id="listaItensPrecificacao" class="space-y-2 divide-y divide-slate-800"></div>

            <button type="button" id="btnSalvarTabelaFornecedor" onclick="salvarTabelaFornecedor()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-black rounded-xl text-xs uppercase shadow-lg active:scale-95 transition">
                <i class="fas fa-save mr-1"></i> Salvar Horários, Aviso, Preços e Taxa de Entrega
            </button>
        </div>
    </div>

    <script src="js/supabase.js"></script>
    <script>
        let fornecedorAtual = null;
        let tokenFornecedor = null;

        async function chamarApiFornecedor(action, payload = {}, token = tokenFornecedor) {
            const resposta = await fetch(`${supabaseUrl}/functions/v1/fornecedor-api`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'apikey': supabaseKey,
                    ...(token ? { 'Authorization': `Bearer ${token}` } : {})
                },
                body: JSON.stringify({ action, ...payload })
            });
            const texto = await resposta.text();
            let dados;
            try { dados = JSON.parse(texto); }
            catch (_) { throw new Error('Resposta inválida do servidor.'); }
            if (!resposta.ok || dados?.error) {
                throw new Error(dados?.error || `Erro HTTP ${resposta.status}.`);
            }
            if (!dados || typeof dados !== 'object') {
                throw new Error('Resposta vazia do servidor.');
            }
            return dados;
        }

        function alternarModo24hFornecedor() {
            const chk24h = document.getElementById('chkAceita24hForn');
            const boxHr = document.getElementById('boxHorariosRestritosForn');
            const lbl = document.getElementById('lblStatus24hForn');
            if (chk24h && boxHr) {
                boxHr.classList.toggle('hidden', chk24h.checked);
                if (lbl) lbl.textContent = chk24h.checked ? 'Ativado (24h)' : 'Horário Fixo';
            }
        }

        document.getElementById('formLoginFornecedor').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.currentTarget.querySelector('button[type="submit"]');
            const whats = document.getElementById('loginFornWhats').value.replace(/\D/g, '');
            const pin = document.getElementById('loginFornPin').value.trim();
            btn.disabled = true;
            btn.textContent = 'Verificando...';
            try {
                const login = await chamarApiFornecedor('login', { whatsapp: whats, pin }, null);
                if (!login?.token || !login?.fornecedor?.id) {
                    throw new Error('Login não confirmado pelo servidor.');
                }
                tokenFornecedor = login.token;
                const inicial = await chamarApiFornecedor('portal_bootstrap');
                if (!inicial?.fornecedor?.id || !Array.isArray(inicial.terreiros)) {
                    throw new Error('Não foi possível validar os dados do fornecedor.');
                }
                fornecedorAtual = inicial.fornecedor;

                document.getElementById('telaLoginFornecedor').classList.add('hidden');
                document.getElementById('painelFornecedorAtivo').classList.remove('hidden');
                document.getElementById('nomeFornecedorLogado').textContent = fornecedorAtual.nome_fantasia;
                document.getElementById('chkAceita24hForn').checked = fornecedorAtual.aceita_24h !== false;
                document.getElementById('inputHoraAberturaForn').value = fornecedorAtual.hora_abertura || '08:00';
                document.getElementById('inputHoraFechamentoForn').value = fornecedorAtual.hora_fechamento || '18:00';
                document.getElementById('inputAvisoEntregaFornecedor').value = fornecedorAtual.aviso_entrega || '';
                alternarModo24hFornecedor();

                const sel = document.getElementById('selectTerreiroFornecedor');
                sel.innerHTML = (inicial.terreiros || []).map(t =>
                    `<option value="${t.id}">${t.nome} ${t.address ? `(${t.address})` : ''}</option>`
                ).join('');
                if (!inicial.terreiros?.length) {
                    document.getElementById('listaItensPrecificacao').innerHTML =
                        '<p class="text-xs text-slate-500 py-4 text-center">Nenhum terreiro disponível para atualização.</p>';
                    return;
                }
                await carregarItensTerreiroFornecedor();
            } catch (err) {
                tokenFornecedor = null;
                fornecedorAtual = null;
                document.getElementById('painelFornecedorAtivo').classList.add('hidden');
                document.getElementById('telaLoginFornecedor').classList.remove('hidden');
                document.getElementById('loginFornPin').value = '';
                alert(err.message || 'Não foi possível entrar no painel.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Entrar no Painel';
            }
        });

        async function carregarItensTerreiroFornecedorOriginal() {
            const terreiroId = document.getElementById('selectTerreiroFornecedor').value;
            const container = document.getElementById('listaItensPrecificacao');
            if (!terreiroId || !fornecedorAtual || !container) return;
            container.innerHTML = '<p class="text-xs text-slate-400 py-4 text-center"><i class="fas fa-spinner fa-spin mr-1"></i> Carregando lista de doações...</p>';
            try {
                const result = await chamarApiFornecedor('portal_load', { terreiro_id: terreiroId });
                const frete = result.frete;
                document.getElementById('inputFreteTerreiro').value = frete ? frete.taxa_entrega : '0.00';
                document.getElementById('inputFreteGratisTerreiro').value = frete?.frete_gratis_acima ?? '';

                const itens = result.itens || [];
                const precos = result.precos || [];
                if (itens.length === 0) {
                    container.innerHTML = '<p class="text-xs text-slate-500 py-4 text-center">Este terreiro ainda não cadastrou itens de doação.</p>';
                    return;
                }

                const itensProcessados = itens.map(item => {
                    const p = precos.find(x => String(x.item_id) === String(item.id));
                    return { item, val: p ? p.preco_unitario : '', disp: p ? p.disponivel === true : false, jaSalvo: !!p };
                });
                itensProcessados.sort((a, b) => {
                    if (a.disp === b.disp) return a.item.nome.localeCompare(b.item.nome);
                    return a.disp ? -1 : 1;
                });

                renderizarCatalogoPortal(itensProcessados);
            } catch (err) {
                container.textContent = err.message;
                throw err;
            }
        }

        function autoMarcarEstoque(input) {
            const itemId = input.getAttribute('data-item-id');
            const chk = document.querySelector(`.chk-disp-forn[data-item-id="${itemId}"]`);
            if (chk && parseFloat(input.value) > 0) chk.checked = true;
        }

        function aplicarPrecoEmLote(familia) {
            const linhaOrigem = document.querySelector(`.item-linha-fornecedor[data-familia="${familia}"]`);
            if (!linhaOrigem) return;
            const inpOrigem = linhaOrigem.querySelector('.inp-preco-forn');
            const chkOrigem = linhaOrigem.querySelector('.chk-disp-forn');
            if (!inpOrigem) return;
            document.querySelectorAll(`.item-linha-fornecedor[data-familia="${familia}"]`).forEach(linha => {
                const inp = linha.querySelector('.inp-preco-forn');
                const chk = linha.querySelector('.chk-disp-forn');
                if (inp) inp.value = inpOrigem.value;
                if (chk) chk.checked = chkOrigem?.checked === true;
            });
            alert('Preço e status de estoque aplicados às variações semelhantes.');
        }

        async function salvarTabelaFornecedorOriginal() {
            const terreiroId = document.getElementById('selectTerreiroFornecedor').value;
            const btn = document.getElementById('btnSalvarTabelaFornecedor');
            if (!terreiroId || !fornecedorAtual || !tokenFornecedor) return alert('Sessão do fornecedor inválida. Entre novamente.');
            const aceita24h = document.getElementById('chkAceita24hForn')?.checked !== false;
            const horaAbertura = document.getElementById('inputHoraAberturaForn')?.value || '08:00';
            const horaFechamento = document.getElementById('inputHoraFechamentoForn')?.value || '18:00';
            const avisoEntrega = (document.getElementById('inputAvisoEntregaFornecedor')?.value || '').trim();
            const taxaEntrega = document.getElementById('inputFreteTerreiro').value || '0';
            const freteGratis = document.getElementById('inputFreteGratisTerreiro').value;
            const precos = [];
            document.querySelectorAll('.inp-preco-forn').forEach(inp => {
                const itemId = Number(inp.getAttribute('data-item-id'));
                const preco = Number(inp.value || 0);
                const jaSalvo = inp.getAttribute('data-ja-salvo') === 'true';
                const chk = document.querySelector(`.chk-disp-forn[data-item-id="${itemId}"]`);
                if (preco > 0 || jaSalvo) precos.push({ item_id: itemId, preco_unitario: preco, disponivel: chk?.checked === true });
            });
            btn.disabled = true;
            btn.textContent = 'Salvando...';
            try {
                await chamarApiFornecedor('portal_save', {
                    terreiro_id: terreiroId,
                    configuracoes: { aceita_24h: aceita24h, hora_abertura: horaAbertura, hora_fechamento: horaFechamento, aviso_entrega: avisoEntrega },
                    frete: { taxa_entrega: taxaEntrega, frete_gratis_acima: freteGratis },
                    precos
                });
                fornecedorAtual.aceita_24h = aceita24h;
                fornecedorAtual.hora_abertura = horaAbertura;
                fornecedorAtual.hora_fechamento = horaFechamento;
                fornecedorAtual.aviso_entrega = avisoEntrega;
                document.querySelectorAll('.inp-preco-forn').forEach(i => i.dataset.jaSalvo = 'true');
                capturarEstadoPortal();
                document.getElementById('estadoSalvarPortal').textContent = 'Alterações salvas com sucesso.';
            } catch (err) {
                alert('Erro ao salvar: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Salvar alterações';
            }
        }

let estadoPortal=[],casaPortal='',ocupadoPortal=false,prontoPortal=false;
const portalEl=id=>document.getElementById(id);
function camposPortal(){return [...document.querySelectorAll('#painelFornecedorAtivo input:not(.portal-selecao):not(#buscaPortal):not(#precoLotePortal), #painelFornecedorAtivo textarea')];}
function portalAlterado(){return estadoPortal.some(x=>x.el.value!==x.valor || x.el.checked!==x.checked);}
function capturarEstadoPortal(){estadoPortal=camposPortal().map(el=>({el,valor:el.value,checked:el.checked}));atualizarEstadoPortal();}
function atualizarEstadoPortal(){
 const alterado=portalAlterado();
 portalEl('btnSalvarTabelaFornecedor').disabled=ocupadoPortal || !prontoPortal || !alterado;
 portalEl('estadoSalvarPortal').textContent=ocupadoPortal?'Aguarde...':alterado?'Alterações não salvas':prontoPortal?'Tudo salvo':'Selecione uma casa';
 atualizarSelecaoPortal();
 document.querySelectorAll('.portal-linha').forEach(l=>l.classList.toggle('editado',estadoPortal.some(x=>l.contains(x.el)&&(x.el.value!==x.valor || x.el.checked!==x.checked))));
}
function travarPortal(valor){ocupadoPortal=valor;document.querySelectorAll('#painelFornecedorAtivo input,#painelFornecedorAtivo select,#painelFornecedorAtivo textarea,#painelFornecedorAtivo button').forEach(el=>el.disabled=valor);atualizarEstadoPortal();}
function grupoProdutoPortal(item){
 const nome=String(item.nome||'').trim();
 const familia=nome.match(/^(Pacote de Velas 7 (?:dias|horas) com 10 Velas|Vela 7 (?:dias|horas))\b/i);
 return String(item.categoria||'Geral')+' • '+(familia?familia[1]:'Outros produtos');
}
function renderizarCatalogoPortal(itens){
 const lista=portalEl('listaItensPrecificacao');lista.replaceChildren();
 const grupos=new Map();
 itens.forEach(obj=>{const nome=grupoProdutoPortal(obj.item);if(!grupos.has(nome))grupos.set(nome,[]);grupos.get(nome).push(obj);});
 for(const [nome,produtos] of grupos){
  const grupo=document.createElement('details');grupo.className='portal-grupo';
  const titulo=document.createElement('summary');titulo.textContent=nome+' ('+produtos.length+')';grupo.appendChild(titulo);
  grupo.open=grupos.size===1;
  for(const {item,val,disp,jaSalvo} of produtos){
   const linha=document.createElement('div');linha.className='portal-linha item-linha-fornecedor';linha.dataset.busca=normalizarBuscaPortal(item.nome+' '+item.categoria);linha.dataset.categoria=item.categoria||'Geral';
   const texto=document.createElement('div');const rotulo=document.createElement('label');rotulo.className='flex items-center gap-3';
   const selecao=document.createElement('input');selecao.type='checkbox';selecao.className='portal-selecao';selecao.setAttribute('aria-label','Selecionar '+item.nome);
   const tituloItem=document.createElement('span');tituloItem.className='portal-nome';tituloItem.textContent=item.nome;
   const selecionar=document.createElement('span');selecionar.className='portal-selecionar';selecionar.append(selecao,document.createTextNode('Selecionar'));rotulo.append(selecionar,tituloItem);texto.appendChild(rotulo);
   const meta=document.createElement('p');meta.className='portal-meta';meta.textContent=item.categoria||'Geral';texto.appendChild(meta);
   const campos=document.createElement('div');campos.className='portal-campos';
   const estoque=document.createElement('label');estoque.className='flex items-center gap-2 text-sm';
   const chk=document.createElement('input');chk.type='checkbox';chk.className='chk-disp-forn';chk.dataset.itemId=item.id;chk.checked=disp;estoque.append(chk,document.createTextNode('Disponível para compra'));
   const precoLabel=document.createElement('label');precoLabel.className='flex items-center gap-2 text-sm';precoLabel.appendChild(document.createTextNode('R$'));
   const preco=document.createElement('input');preco.type='number';preco.step='0.01';preco.min='0';preco.inputMode='decimal';preco.className='inp-preco-forn portal-preco';preco.dataset.itemId=item.id;preco.dataset.jaSalvo=String(jaSalvo);preco.value=val;preco.placeholder='0,00';preco.setAttribute('aria-label','Preço de '+item.nome);
   preco.addEventListener('input',()=>{autoMarcarEstoque(preco);atualizarEstadoPortal();});precoLabel.appendChild(preco);campos.append(estoque,precoLabel);linha.append(texto,campos);grupo.appendChild(linha);
  }
  lista.appendChild(grupo);
 }
 const categorias=[...new Set(itens.map(x=>x.item.categoria||'Geral'))];
 portalEl('categoriaPortal').replaceChildren(new Option('Todas as categorias',''));
 categorias.forEach(c=>portalEl('categoriaPortal').add(new Option(c,c)));
 filtrarPortal();
}
function normalizarBuscaPortal(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
function filtrarPortal(){
 const busca=normalizarBuscaPortal(portalEl('buscaPortal').value).split(/\s+/).filter(Boolean),cat=portalEl('categoriaPortal').value,status=portalEl('statusPortal').value;
 let total=0;
 document.querySelectorAll('.portal-linha').forEach(l=>{const preco=l.querySelector('.inp-preco-forn'),disp=l.querySelector('.chk-disp-forn').checked;
 const visivel=busca.every(b=>l.dataset.busca.includes(b))&&(!cat||cat===l.dataset.categoria)&&(!status||(status==='disponivel'&&disp)||(status==='indisponivel'&&!disp)||(status==='sem_preco'&&!(Number(preco.value)>0)));
 l.hidden=!visivel;if(visivel)total++;else l.querySelector('.portal-selecao').checked=false;
 });
 document.querySelectorAll('.portal-grupo').forEach(g=>{g.hidden=![...g.querySelectorAll('.portal-linha')].some(l=>!l.hidden);if(busca.length||cat||status)g.open=!g.hidden;});
 portalEl('contagemPortal').textContent=total+' produtos encontrados';
 atualizarSelecaoPortal();
}
async function carregarItensTerreiroFornecedor(){
 const sel=portalEl('selectTerreiroFornecedor');if(ocupadoPortal){sel.value=casaPortal;return;}
 if(portalAlterado()){sel.value=casaPortal;alert('Salve ou desfaça as alterações antes de trocar de terreiro.');return;}
 travarPortal(true);prontoPortal=false;
 try{await carregarItensTerreiroFornecedorOriginal();casaPortal=sel.value;prontoPortal=true;capturarEstadoPortal();}
 catch(e){portalEl('estadoSalvarPortal').textContent='Falha ao carregar. Selecione a casa novamente.';}
 finally{travarPortal(false);}
}
async function salvarTabelaFornecedor(){
 if(ocupadoPortal||!prontoPortal||!portalAlterado())return;
 const campos=[...document.querySelectorAll('.inp-preco-forn'),portalEl('inputFreteTerreiro'),portalEl('inputFreteGratisTerreiro')];
 for(const i of campos){if(i.validity.badInput || (i.value!==''&&(!Number.isFinite(Number(i.value))||Number(i.value)<0||!i.checkValidity()))){alert('Confira o valor informado. Use valores positivos com até duas casas decimais.');i.closest('details')?.setAttribute('open','');i.focus();return;}}
 const invalido=[...document.querySelectorAll('.portal-linha')].find(l=>l.querySelector('.chk-disp-forn').checked && !(Number(l.querySelector('.inp-preco-forn').value)>0));
 if(invalido){alert('Informe um preço maior que zero para os produtos disponíveis.');invalido.closest('details').open=true;invalido.hidden=false;invalido.querySelector('.inp-preco-forn').focus();return;}
 travarPortal(true);try{await salvarTabelaFornecedorOriginal();}finally{travarPortal(false);}
}
function atualizarSelecaoPortal(){
 const n=[...document.querySelectorAll('.portal-linha')].filter(l=>!l.hidden && l.querySelector('.portal-selecao').checked).length;
 const btn=portalEl('aplicarLotePortal');if(!btn)return;btn.textContent='Aplicar a '+n+' produto'+(n===1?'':'s');btn.disabled=ocupadoPortal || !n;
 portalEl('selecaoLotePortal').textContent=n ? n+' produto'+(n===1?' selecionado':'s selecionados') : 'Nenhum produto selecionado';
 document.querySelectorAll('.portal-linha').forEach(l=>l.classList.toggle('selecionado',l.querySelector('.portal-selecao').checked));
}
function aplicarLotePortal(){
 const linhas=[...document.querySelectorAll('.portal-linha')].filter(l=>!l.hidden&&l.querySelector('.portal-selecao').checked);
 if(!linhas.length)return alert('Selecione os produtos que deseja alterar.');
 const campo=portalEl('precoLotePortal'),v=campo.value,estado=portalEl('estoqueLotePortal').value;
 if(v===''&&!estado)return alert('Informe um preço ou escolha a disponibilidade.');
 if(v!==''&&(!campo.checkValidity()||!(Number(v)>0)))return alert('Informe um preço válido maior que zero.');
 if(!confirm('Aplicar estas alterações a '+linhas.length+' produtos selecionados?'))return;
 linhas.forEach(l=>{if(v!=='')l.querySelector('.inp-preco-forn').value=v;if(estado)l.querySelector('.chk-disp-forn').checked=estado==='sim';});atualizarEstadoPortal();
}
(function montarPortal(){
 const painel=portalEl('painelFornecedorAtivo');const primeiro=painel.children[0];const config=primeiro.children[1];
 const detalhes=document.createElement('details');detalhes.className='bg-slate-900 border border-slate-800 rounded-2xl p-4';
 const resumo=document.createElement('summary');resumo.className='font-bold cursor-pointer';resumo.textContent='Funcionamento e avisos de entrega';detalhes.append(resumo,config);painel.appendChild(detalhes);
 const lista=portalEl('listaItensPrecificacao');lista.previousElementSibling.textContent='Seus produtos';
 const toolbar=document.createElement('div');toolbar.innerHTML=`<div class="portal-toolbar"><label>Buscar produto<input id="buscaPortal" type="search" placeholder="Ex.: vela branca, pacote, 7 dias"></label><label>Categoria<select id="categoriaPortal"><option value="">Todas as categorias</option></select></label><label>Mostrar<select id="statusPortal"><option value="">Todos os produtos</option><option value="disponivel">Disponíveis</option><option value="indisponivel">Indisponíveis</option><option value="sem_preco">Sem preço</option></select></label></div><p id="contagemPortal" class="text-sm text-slate-400 mt-3" aria-live="polite"></p><details id="modoLotePortal" class="mt-3"><summary class="cursor-pointer py-3 font-bold text-indigo-300">Alterar vários produtos</summary><p class="text-sm text-slate-400">1. Selecione os produtos abaixo. 2. Informe o novo preço ou a disponibilidade. 3. Aplique e depois salve.</p><button type="button" id="selecionarVisiveisPortal" class="text-indigo-300">Selecionar todos os resultados</button> · <button type="button" id="limparSelecaoPortal" class="text-slate-300">Limpar seleção</button><div class="portal-lote"><label>Preço (R$)<input id="precoLotePortal" type="number" step="0.01" min="0.01" inputmode="decimal" placeholder="Não alterar preço"></label><label>Disponibilidade<select id="estoqueLotePortal"><option value="">Não alterar disponibilidade</option><option value="sim">Disponível</option><option value="nao">Indisponível</option></select></label><button type="button" id="aplicarLotePortal">Aplicar a 0 produtos</button><p id="selecaoLotePortal" class="text-sm text-indigo-300" role="status">Nenhum produto selecionado</p></div></details>`;
 lista.before(toolbar);
 const salvar=portalEl('btnSalvarTabelaFornecedor');const rodape=document.createElement('div');rodape.className='portal-salvar';
 const estado=document.createElement('p');estado.id='estadoSalvarPortal';estado.setAttribute('role','status');
 const desfazer=document.createElement('button');desfazer.type='button';desfazer.textContent='Desfazer';desfazer.className='text-slate-300 px-2';desfazer.onclick=()=>{if(!portalAlterado()||!confirm('Descartar as alterações não salvas?'))return;estadoPortal.forEach(x=>{x.el.value=x.valor;x.el.checked=x.checked;});alternarModo24hFornecedor();atualizarEstadoPortal();filtrarPortal();};
 salvar.textContent='Salvar alterações';rodape.append(estado,desfazer,salvar);painel.appendChild(rodape);
 for(const id of ['buscaPortal','categoriaPortal','statusPortal'])portalEl(id).addEventListener('input',filtrarPortal);
 portalEl('aplicarLotePortal').onclick=aplicarLotePortal;
 portalEl('modoLotePortal').addEventListener('toggle',()=>{const ativo=portalEl('modoLotePortal').open;painel.classList.toggle('modo-lote',ativo);if(!ativo)document.querySelectorAll('.portal-selecao').forEach(c=>c.checked=false);atualizarSelecaoPortal();});
 painel.addEventListener('change',atualizarSelecaoPortal);
 portalEl('selecionarVisiveisPortal').onclick=()=>{document.querySelectorAll('.portal-linha').forEach(l=>l.querySelector('.portal-selecao').checked=!l.hidden);atualizarSelecaoPortal();};
 portalEl('limparSelecaoPortal').onclick=()=>{document.querySelectorAll('.portal-selecao').forEach(c=>c.checked=false);atualizarSelecaoPortal();};
 painel.addEventListener('input',atualizarEstadoPortal);painel.addEventListener('change',atualizarEstadoPortal);
 window.addEventListener('beforeunload',e=>{if(portalAlterado()){e.preventDefault();e.returnValue='';}});
 atualizarEstadoPortal();
})();

        // Funções chamadas pelo HTML.
        window.alternarModo24hFornecedor = alternarModo24hFornecedor;
        window.carregarItensTerreiroFornecedor = carregarItensTerreiroFornecedor;
        window.autoMarcarEstoque = autoMarcarEstoque;
        window.aplicarPrecoEmLote = aplicarPrecoEmLote;
        window.salvarTabelaFornecedor = salvarTabelaFornecedor;
    </script>
