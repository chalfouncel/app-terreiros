<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Fornecedor Parceiro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 p-4 flex flex-col items-center">

    <!-- TELA DE LOGIN DO FORNECEDOR -->
    <div id="telaLoginFornecedor" class="w-full max-w-sm mt-12 bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-4">
        <div class="text-center space-y-1">
            <div class="w-14 h-14 rounded-2xl bg-amber-500/20 text-amber-400 flex items-center justify-center mx-auto text-2xl border border-amber-500/30">
                <i class="fas fa-truck-loading"></i>
            </div>
            <h1 class="text-lg font-black uppercase text-white pt-2">Portal do Fornecedor</h1>
            <p class="text-xs text-slate-400">Atualize preços, horários, avisos de entrega e frete para os Terreiros</p>
        </div>

        <form id="formLoginFornecedor" class="space-y-3">
            <div>
                <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">WhatsApp Cadastrado</label>
                <input type="tel" id="loginFornWhats" required placeholder="(21) 99999-9999" class="w-full px-3.5 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-sm text-white outline-none focus:border-amber-500">
            </div>
            <div>
                <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">PIN de Acesso (6 dígitos)</label>
                <input type="password" id="loginFornPin" required maxlength="6" placeholder="******" class="w-full px-3.5 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-center font-mono text-base text-white outline-none focus:border-amber-500">
            </div>
            <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-xl text-xs uppercase tracking-wider shadow active:scale-95 transition">
                Entrar no Painel
            </button>
        </form>
    </div>

    <!-- PAINEL DE TABELA DE PREÇOS E FRETE DO FORNECEDOR -->
    <div id="painelFornecedorAtivo" class="hidden w-full max-w-2xl mt-4 space-y-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
            <div class="flex justify-between items-center">
                <div>
                    <span class="text-[10px] font-bold text-amber-400 uppercase">Fornecedor Parceiro</span>
                    <h2 id="nomeFornecedorLogado" class="text-base font-black text-white"></h2>
                </div>
                <button type="button" onclick="location.reload()" class="text-xs text-rose-400 font-bold bg-rose-500/10 px-3 py-1.5 rounded-xl border border-rose-500/20">Sair</button>
            </div>

            <div class="pt-3 border-t border-slate-800 space-y-3">
                <!-- BOTÃO / TOGGLE ACEITA PEDIDO 24HS -->
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 bg-slate-800/90 border border-slate-700 p-3 rounded-xl">
                    <div>
                        <span class="text-xs font-black text-emerald-400 uppercase flex items-center gap-1.5">
                            <i class="fas fa-bolt"></i> Aceita pedido 24hs
                        </span>
                        <p class="text-[10px] text-slate-400">Se desmarcado, o aplicativo bloqueará compras fora do horário definido abaixo.</p>
                    </div>
                    <label class="inline-flex items-center gap-2 cursor-pointer shrink-0 bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700">
                        <input type="checkbox" id="chkAceita24hForn" onchange="alternarModo24hFornecedor()" class="w-4 h-4 accent-emerald-500 rounded cursor-pointer" checked>
                        <span class="text-xs font-bold text-white" id="lblStatus24hForn">Ativado (24h)</span>
                    </label>
                </div>

                <!-- HORÁRIOS DE FUNCIONAMENTO (SÓ APARECE SE DESMARCAR 24HS) -->
                <div id="boxHorariosRestritosForn" class="hidden grid grid-cols-2 gap-3 bg-slate-950/60 p-3 rounded-xl border border-slate-800">
                    <div>
                        <label class="block text-[10px] font-bold text-emerald-400 uppercase mb-1"><i class="far fa-clock mr-1"></i> Abre às (Libera Pagto)</label>
                        <input type="time" id="inputHoraAberturaForn" value="08:00" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-xs font-bold text-white outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-rose-400 uppercase mb-1"><i class="fas fa-lock mr-1"></i> Fecha às (Bloqueia Pagto)</label>
                        <input type="time" id="inputHoraFechamentoForn" value="18:00" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-xs font-bold text-white outline-none focus:border-amber-500">
                    </div>
                </div>

                <!-- AVISO SOBRE HORÁRIOS DE ENTREGA EM DESTAQUE -->
                <div>
                    <label class="block text-[10px] font-black text-amber-400 uppercase mb-1">
                        <i class="fas fa-bullhorn mr-1"></i> Aviso sobre Horários de Entrega / Condições (Aparece em destaque para o cliente antes do pagamento)
                    </label>
                    <textarea id="inputAvisoEntregaFornecedor" rows="2" maxlength="220" placeholder="Ex: Entregas de Seg a Sex das 09h às 17h. Pedidos feitos à noite ou fim de semana serão entregues no próximo dia útil." class="w-full px-3 py-2 bg-slate-800 border border-amber-500/40 rounded-xl text-xs text-amber-100 outline-none focus:border-amber-400"></textarea>
                </div>
            </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
            <label class="block text-xs font-black text-indigo-300 uppercase"><i class="fas fa-synagogue mr-1"></i> 1. Selecione o Terreiro para atualizar preços e frete:</label>
            <select id="selectTerreiroFornecedor" onchange="carregarItensTerreiroFornecedor()" class="w-full px-3 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-sm font-bold text-white outline-none"></select>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Taxa de Entrega p/ este Terreiro (R$)</label>
                    <input type="number" step="0.01" id="inputFreteTerreiro" placeholder="Ex: 15.00" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-sm font-bold text-emerald-400 outline-none">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Frete Grátis acima de (R$ - Opcional)</label>
                    <input type="number" step="0.01" id="inputFreteGratisTerreiro" placeholder="Ex: 150.00" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-sm font-bold text-amber-300 outline-none">
                </div>
            </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
            <h3 class="text-xs font-black text-amber-400 uppercase"><i class="fas fa-tags mr-1"></i> 2. Lista de Doações do Terreiro (Informe seu Preço Unitário)</h3>
            <div id="listaItensPrecificacao" class="space-y-2 divide-y divide-slate-800"></div>

            <button type="button" id="btnSalvarTabelaFornecedor" onclick="salvarTabelaFornecedor()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-black rounded-xl text-xs uppercase shadow-lg active:scale-95 transition">
                <i class="fas fa-save mr-1"></i> Salvar Horários, Aviso, Preços e Taxa de Entrega
            </button>
        </div>
    </div>

    <script src="js/supabase.js"></script>
    <script>
        let fornecedorAtual = null;

        function alternarModo24hFornecedor() {
            const chk24h = document.getElementById('chkAceita24hForn');
            const boxHr = document.getElementById('boxHorariosRestritosForn');
            const lbl = document.getElementById('lblStatus24hForn');
            if (chk24h && boxHr) {
                boxHr.classList.toggle('hidden', chk24h.checked);
                if (lbl) lbl.textContent = chk24h.checked ? 'Ativado (24h)' : 'Horário Fixo';
            }
        }

        document.getElementById('formLoginFornecedor').addEventListener('submit', async (e) => {
            e.preventDefault();
            const whats = document.getElementById('loginFornWhats').value.replace(/\D/g, '');
            const pin = document.getElementById('loginFornPin').value.trim();

            const { data, error } = await supabaseClient.from('fornecedores')
                .select('*')
                .eq('whatsapp', whats)
                .eq('pin_acesso', pin)
                .eq('ativo', true)
                .single();

            if (error || !data) return alert('WhatsApp ou PIN incorretos.');
            fornecedorAtual = data;

            document.getElementById('telaLoginFornecedor').classList.add('hidden');
            document.getElementById('painelFornecedorAtivo').classList.remove('hidden');
            document.getElementById('nomeFornecedorLogado').textContent = data.nome_fantasia;

            document.getElementById('chkAceita24hForn').checked = data.aceita_24h !== false;
            document.getElementById('inputHoraAberturaForn').value = data.hora_abertura || '08:00';
            document.getElementById('inputHoraFechamentoForn').value = data.hora_fechamento || '18:00';
            document.getElementById('inputAvisoEntregaFornecedor').value = data.aviso_entrega || '';
            alternarModo24hFornecedor();

            const { data: terreiros } = await supabaseClient.from('terreiros').select('id, nome, address, address_number').eq('status_bloqueado', false).order('nome');
            const sel = document.getElementById('selectTerreiroFornecedor');
            sel.innerHTML = (terreiros || []).map(t => `<option value="${t.id}">${t.nome} ${t.address ? `(${t.address})` : ''}</option>`).join('');

            await carregarItensTerreiroFornecedor();
        });

        async function carregarItensTerreiroFornecedor() {
            const terreiroId = document.getElementById('selectTerreiroFornecedor').value;
            const container = document.getElementById('listaItensPrecificacao');
            if (!terreiroId || !fornecedorAtual || !container) return;

            container.innerHTML = '<p class="text-xs text-slate-400 py-4 text-center"><i class="fas fa-spinner fa-spin mr-1"></i> Carregando lista de doações...</p>';

            const { data: frete } = await supabaseClient.from('fornecedores_terreiros_frete')
                .select('*')
                .eq('fornecedor_id', fornecedorAtual.id)
                .eq('terreiro_id', terreiroId)
                .maybeSingle();

            document.getElementById('inputFreteTerreiro').value = frete ? frete.taxa_entrega : '0.00';
            document.getElementById('inputFreteGratisTerreiro').value = frete && frete.frete_gratis_acima ? frete.frete_gratis_acima : '';

            // Busca todos os itens do terreiro e filtra no JS (evita que itens com categoria NULL sumam no SQL .neq)
            const { data: todosItens, error: errItens } = await supabaseClient.from('itens_doacao')
                .select('*')
                .eq('terreiro_id', terreiroId)
                .order('nome');

            if (errItens) {
                container.innerHTML = `<p class="text-xs text-rose-400 py-4 text-center">Erro ao ler catálogo: ${errItens.message}</p>`;
                return;
            }

            const itens = (todosItens || []).filter(item => {
                const ativoOk = item.ativo !== false;
                const cat = String(item.categoria || '').toLowerCase().trim();
                return ativoOk && cat !== 'cantina';
            });

            const { data: precos } = await supabaseClient.from('fornecedores_precos_itens')
                .select('*')
                .eq('fornecedor_id', fornecedorAtual.id)
                .eq('terreiro_id', terreiroId);

            if (itens.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-500 py-4 text-center">Este terreiro ainda não cadastrou itens de doação.</p>';
                return;
            }

            container.innerHTML = itens.map(item => {
                const p = (precos || []).find(x => String(x.item_id) === String(item.id));
                const val = p ? p.preco_unitario : '';
                const disp = p ? p.disponivel !== false : true;
                return `
                <div class="pt-2.5 flex items-center justify-between gap-3">
                    <div class="flex-1">
                        <p class="text-xs font-bold text-white">${item.nome}</p>
                        <span class="text-[10px] text-slate-400 uppercase">${item.categoria || 'Geral'}</span>
                    </div>
                    <label class="flex items-center gap-1 text-[10px] text-slate-300 cursor-pointer">
                        <input type="checkbox" class="chk-disp-forn rounded" data-item-id="${item.id}" ${disp ? 'checked' : ''}> Estoque
                    </label>
                    <div class="flex items-center gap-1">
                        <span class="text-xs text-slate-400 font-bold">R$</span>
                        <input type="number" step="0.01" min="0" data-item-id="${item.id}" value="${val}" placeholder="0.00" class="inp-preco-forn w-24 px-2.5 py-1.5 bg-slate-800 border border-slate-700 rounded-xl text-xs font-bold text-right text-amber-300 outline-none">
                    </div>
                </div>`;
            }).join('');
        }

        async function salvarTabelaFornecedor() {
            const terreiroId = document.getElementById('selectTerreiroFornecedor').value;
            const btn = document.getElementById('btnSalvarTabelaFornecedor');
            const aceita24h = document.getElementById('chkAceita24hForn')?.checked !== false;
            const horaAbertura = document.getElementById('inputHoraAberturaForn')?.value || '08:00';
            const horaFechamento = document.getElementById('inputHoraFechamentoForn')?.value || '18:00';
            const avisoEntrega = (document.getElementById('inputAvisoEntregaFornecedor')?.value || '').trim();

            btn.disabled = true;
            btn.textContent = 'Salvando...';

            try {
                const { error: errForn } = await supabaseClient
                    .from('fornecedores')
                    .update({
                        aceita_24h: aceita24h,
                        hora_abertura: horaAbertura,
                        hora_fechamento: horaFechamento,
                        aviso_entrega: avisoEntrega || null
                    })
                    .eq('id', fornecedorAtual.id);
                if (errForn) throw errForn;

                fornecedorAtual.aceita_24h = aceita24h;
                fornecedorAtual.hora_abertura = horaAbertura;
                fornecedorAtual.hora_fechamento = horaFechamento;
                fornecedorAtual.aviso_entrega = avisoEntrega;

                const taxaEntrega = parseFloat(document.getElementById('inputFreteTerreiro').value) || 0;
                const valFreteGratis = document.getElementById('inputFreteGratisTerreiro').value;
                const freteGratis = valFreteGratis ? parseFloat(valFreteGratis) : null;

                await supabaseClient.from('fornecedores_terreiros_frete').upsert({
                    fornecedor_id: fornecedorAtual.id,
                    terreiro_id: terreiroId,
                    taxa_entrega: taxaEntrega,
                    frete_gratis_acima: freteGratis
                }, { onConflict: 'fornecedor_id,terreiro_id' });

                const inputs = document.querySelectorAll('.inp-preco-forn');
                const upserts = [];
                inputs.forEach(inp => {
                    const itemId = parseInt(inp.getAttribute('data-item-id'), 10);
                    const preco = parseFloat(inp.value) || 0;
                    const chk = document.querySelector(`.chk-disp-forn[data-item-id="${itemId}"]`);
                    if (preco > 0) {
                        upserts.push({
                            fornecedor_id: fornecedorAtual.id,
                            terreiro_id: terreiroId,
                            item_id: itemId,
                            preco_unitario: preco,
                            disponivel: chk ? chk.checked : true,
                            updated_at: new Date().toISOString()
                        });
                    }
                });

                if (upserts.length > 0) {
                    await supabaseClient.from('fornecedores_precos_itens').upsert(upserts, { onConflict: 'fornecedor_id,item_id' });
                }

                alert('✅ Horários, aviso de entrega, preços e frete atualizados com sucesso!');
            } catch (err) {
                alert('Erro ao salvar: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save mr-1"></i> Salvar Horários, Aviso, Preços e Taxa de Entrega';
            }
        }
    </script>
</body>
</html>
