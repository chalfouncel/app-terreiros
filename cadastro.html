<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completar Cadastro - Terreiro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md border-t-4 border-green-600">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">Ficha de Médium</h2>
            <p class="text-gray-500 text-sm mt-1">Complete seus dados para acessar a plataforma.</p>
        </div>

        <form id="formCadastro" class="space-y-4">
            
            <div>
                <label class="block text-sm font-medium text-gray-700">Nome completo *</label>
                <input type="text" id="nomeCompleto" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Nome social</label>
                <input type="text" id="nomeSocial" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Grau *</label>
                    <select id="grau" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500 bg-white">
                        <option value="" disabled selected>Selecione...</option>
                        <option value="-">-</option>
                        <option value="I">I</option>
                        <option value="IJ">IJ</option>
                        <option value="B">B</option>
                        <option value="BJ">BJ</option>
                        <option value="T">T</option>
                        <option value="TJ">TJ</option>
                        <option value="SCT">SCT</option>
                        <option value="Escola de CT">Escola de CT</option>
                        <option value="CT">CT</option>
                        <option value="SCCT">SCCT</option>
                        <option value="Escola de CCT">Escola de CCT</option>
                        <option value="CCT">CCT</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Função</label>
                    <select id="funcao" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500 bg-white">
                        <option value="" disabled selected>Selecione...</option>
                        <option value="-">-</option>
                        <option value="MG">MG</option>
                        <option value="MGA">MGA</option>
                        <option value="MC">MC</option>
                        <option value="MCA">MCA</option>
                        <option value="MD">MD</option>
                        <option value="MDA">MDA</option>
                        <option value="Cantina">Cantina</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Palavra *</label>
                <input type="text" id="palavra" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500 uppercase placeholder-gray-400" placeholder="EX: PROTEÇÃO">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Data de nascimento *</label>
                    <input type="tel" id="dataNascimento" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500" placeholder="DD/MM/AAAA" maxlength="10">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Telefone (WhatsApp) *</label>
                    <input type="tel" id="telefone" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500" placeholder="(21) 99999-9999" maxlength="15">
                </div>
            </div>

            <div id="containerSenha" class="hidden pt-2 border-t border-gray-100 mt-4">
                <label class="block text-sm font-medium text-gray-700">Crie sua Nova Senha (Apenas Números) *</label>
                <!-- inputmode="numeric" força o teclado numérico. style com disc mascara a senha -->
                <input type="text" inputmode="numeric" id="novaSenha" style="-webkit-text-security: disc; text-security: disc;" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500" placeholder="Mínimo de 6 números" pattern="[0-9]*">
                <p class="text-xs text-gray-500 mt-1">Esta será sua senha para os próximos acessos. Use apenas números.</p>
            </div>

            <div id="msgErro" class="text-red-600 text-sm hidden"></div>

            <button type="submit" id="btnSalvar" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 mt-4">
                Salvar e Continuar
            </button>
        </form>
    </div>

    <script src="js/supabase.js"></script>
    <script src="js/cadastro.js"></script>
</body>
</html>
