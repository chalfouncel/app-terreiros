<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Completar Cadastro - Templo</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1e3a8a">
    <link rel="apple-touch-icon" href="https://pbjwqhfzsvdougeksztq.supabase.co/storage/v1/object/public/public-img/icone-192.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --cor-primaria: #1e3a8a;   
            --cor-secundaria: #16a34a; 
            --cor-fundo: #f3f4f6;      
            --cor-texto: #1f2937;      
        }
        
        .bg-tema-primaria { background-color: var(--cor-primaria) !important; }
        .text-tema-primaria { color: var(--cor-primaria) !important; }
        .border-tema-primaria { border-color: var(--cor-primaria) !important; }
        
        .bg-tema-secundaria { background-color: var(--cor-secundaria) !important; }
        .text-tema-secundaria { color: var(--cor-secundaria) !important; }
        
        body {
            background-color: var(--cor-fundo);
            color: var(--cor-texto);
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl shadow-xl w-full max-w-lg p-6 md:p-8 border border-gray-100 mt-4 mb-4">
        <div class="text-center mb-6">
            <h1 class="text-xl md:text-2xl font-black text-gray-800 tracking-tight">Ficha de Médium</h1>
            <p class="text-xs md:text-sm text-gray-500 mt-1">Complete seus dados para acessar a plataforma.</p>
        </div>

        <form id="formCompletarCadastro" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Nome completo *</label>
                <input type="text" id="cadNomeCompleto" required class="w-full px-3.5 py-2.5 border border-gray-300 rounded-xl text-sm outline-none bg-gray-50 text-gray-700" readonly>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Nome social</label>
                <input type="text" id="cadNomeSocial" class="w-full px-3.5 py-2.5 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-tema-secundaria" placeholder="Ex: Pai Adilton">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Grau *</label>
                    <select id="cadGrau" required class="w-full px-3.5 py-2.5 border border-gray-300 rounded-xl text-sm bg-white outline-none focus:ring-2 focus:ring-tema-secundaria">
                        <option value="I">I</option><option value="IJ">IJ</option>
                        <option value="B">B</option><option value="BJ">BJ</option>
                        <option value="T">T</option><option value="TJ">TJ</option>
                        <option value="SCT">SCT</option><option value="Escola de CT">Escola de CT</option>
                        <option value="CT">CT</option><option value="SCCT">SCCT</option>
                        <option value="Escola de CCT">Escola de CCT</option><option value="CCT">CCT</option>
                        <option value="Dirigente">Dirigente</option><option value="-">-</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Função</label>
                    <select id="cadFuncao" class="w-full px-3.5 py-2.5 border border-gray-300 rounded-xl text-sm bg-white outline-none focus:ring-2 focus:ring-tema-secundaria">
                        <option value="MG">MG</option><option value="MGA">MGA</option>
                        <option value="MC">MC</option><option value="MCA">MCA</option>
                        <option value="MD">MD</option><option value="MDA">MDA</option>
                        <option value="CC">CC</option><option value="CA">CA</option>
                        <option value="Cantina">Cantina</option><option value="Dirigente">Dirigente</option>
                        <option value="-">-</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Palavra *</label>
                <input type="text" id="cadPalavra" required class="w-full px-3.5 py-2.5 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-tema-secundaria uppercase" placeholder="CONFIANÇA">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Data de nascimento *</label>
                    <input type="date" id="cadNascimento" required class="w-full px-3.5 py-2.5 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-tema-secundaria">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Telefone (WhatsApp) *</label>
                    <input type="tel" id="cadTelefone" required class="w-full px-3.5 py-2.5 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-tema-secundaria" placeholder="(21) 99999-9999">
                </div>
            </div>

            <div class="border-t border-gray-200 pt-4 mt-3">
                <p class="text-xs text-gray-500 mb-3 text-center">Para segurança, crie uma senha de acesso contendo <strong>exatamente 6 números</strong>.</p>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Nova Senha *</label>
                        <input type="password" id="cadNovaSenha" required maxlength="6" pattern="\d{6}" class="w-full px-3.5 py-2.5 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-tema-secundaria text-center tracking-[0.5em] font-mono" placeholder="123456" inputmode="numeric">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Confirmar Senha *</label>
                        <input type="password" id="cadConfirmaSenha" required maxlength="6" pattern="\d{6}" class="w-full px-3.5 py-2.5 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-tema-secundaria text-center tracking-[0.5em] font-mono" placeholder="123456" inputmode="numeric">
                    </div>
                </div>
            </div>

            <p id="msgCadastro" class="text-xs md:text-sm font-bold text-center hidden mt-2"></p>

            <button type="submit" id="btnSalvarCadastro" class="w-full bg-tema-secundaria hover:opacity-90 active:scale-[0.98] text-white font-bold py-3 px-4 rounded-xl shadow transition text-sm flex items-center justify-center gap-2 mt-4">
                Salvar e Continuar
            </button>
        </form>
    </div>

    <script src="js/supabase.js"></script>
    <script src="js/cadastro.js"></script>
</body>
</html>
