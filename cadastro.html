<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Terreiros - Completar Cadastro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800">Bem-vindo(a)!</h1>
            <p class="text-gray-500 mt-2">Por favor, complete seus dados para acessar o sistema.</p>
        </div>
        
        <form id="cadastroForm" class="space-y-4">
            <div>
                <label for="nome" class="block text-sm font-medium text-gray-700">Nome Completo</label>
                <input type="text" id="nome" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500">
            </div>
            
            <div>
                <label for="telefone" class="block text-sm font-medium text-gray-700">Telefone (WhatsApp)</label>
                <input type="text" id="telefone" required placeholder="(XX) 9XXXX-XXXX" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500">
            </div>
            
            <div id="errorMessage" class="text-red-500 text-sm hidden"></div>
            
            <button type="submit" id="salvarBtn" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                Salvar Dados
            </button>
        </form>
    </div>

    <!-- Scripts -->
    <script src="js/supabase.js"></script>
    <script src="js/cadastro.js"></script>
</body>
</html>
