<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completar Cadastro - Gestão de Terreiros</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-lg border-t-4 border-[#16a34a]">
        <div class="text-center mb-6">
            <div class="bg-green-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-user-edit text-3xl text-[#16a34a]"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-800">Bem-vindo(a)!</h2>
            <p class="text-sm text-gray-600 mt-2">Este é o seu primeiro acesso. Por favor, complete seus dados para ativar sua conta e trocar a senha padrão.</p>
        </div>

        <form id="formCompletar" class="space-y-5">
            
            <!-- Grupo 1: Nome Social -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Nome Social / Nome de Terreiro *</label>
                <input type="text" id="nomeSocial" required
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#16a34a] focus:border-transparent transition"
                    placeholder="Como você é chamado no terreiro?">
                <p class="text-xs text-gray-500 mt-1">Este é o nome que aparecerá nas listas de presença.</p>
            </div>

            <!-- Grupo 2: WhatsApp (O NOVO LOGIN) -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Seu WhatsApp (DDD + Número) *</label>
                <input type="tel" id="whatsapp" required maxlength="15"
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#16a34a] focus:border-transparent transition"
                    placeholder="(21) 99999-9999">
                <p class="text-xs text-red-500 mt-1 font-medium">⚠️ Muito Importante: Este número será o seu LOGIN nos próximos acessos.</p>
            </div>

            <div class="border-t border-gray-200 my-4 pt-4"></div>

            <!-- Grupo 3: Nova Senha -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Nova Senha *</label>
                    <input type="password" id="novaSenha" required minlength="6"
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#16a34a] focus:border-transparent transition"
                        placeholder="Mínimo 6 caracteres">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Confirme a Senha *</label>
                    <input type="password" id="confirmaSenha" required minlength="6"
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#16a34a] focus:border-transparent transition"
                        placeholder="Digite a senha novamente">
                </div>
            </div>

            <button type="submit" id="btnSalvar"
                class="w-full bg-[#16a34a] hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-all flex justify-center items-center mt-6">
                <i class="fas fa-check-circle mr-2"></i> Salvar e Acessar Sistema
            </button>
        </form>

        <div id="msgErro" class="mt-4 hidden p-3 rounded-lg bg-red-100 text-red-800 text-sm font-bold text-center border-l-4 border-red-600"></div>
        <div id="msgSucesso" class="mt-4 hidden p-3 rounded-lg bg-green-100 text-green-800 text-sm font-bold text-center border-l-4 border-green-600"></div>

    </div>

    <script src="js/supabase.js"></script>
    <script src="js/completar_cadastro.js"></script>
    
    <!-- Script simples para formatar o telefone enquanto a pessoa digita -->
    <script>
        const telefoneInput = document.getElementById('whatsapp');
        telefoneInput.addEventListener('input', function (e) {
            let x = e.target.value.replace(/\D/g, '').match(/(\d{0,2})(\d{0,5})(\d{0,4})/);
            e.target.value = !x[2] ? x[1] : '(' + x[1] + ') ' + x[2] + (x[3] ? '-' + x[3] : '');
        });
    </script>
</body>
</html>
