<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestão de Terreiros</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border-t-4 border-gray-800">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-gray-800">Acesso ao Sistema</h2>
            <p class="text-sm text-gray-500 mt-2">Plataforma de Gestão de Terreiros</p>
        </div>

        <form id="formLogin" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Identificação (Nome ou WhatsApp)</label>
                <input type="text" id="identificacao" required
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-gray-800 focus:border-transparent transition"
                    placeholder="Primeiro acesso? Digite o ID fornecido">
                <p class="text-xs text-gray-500 mt-1">Ex: 32</p>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Senha</label>
                <input type="password" id="senha" required
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-gray-800 focus:border-transparent transition"
                    placeholder="Sua senha de acesso">
            </div>

            <button type="submit" id="btnEntrar"
                class="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-all flex justify-center items-center">
                <span>Entrar no Sistema</span>
            </button>
        </form>

        <div id="msgErro" class="mt-4 hidden p-3 rounded-lg bg-red-100 text-red-800 text-sm font-bold text-center border-l-4 border-red-600">
        </div>
        
        <div class="mt-6 text-center">
            <p class="text-xs text-gray-400">Desenvolvido para gestão eficiente de casas de axé.</p>
        </div>
    </div>

    <script src="js/supabase.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
