<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestão de Terreiros</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Configurações PWA (Instalação do App) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3a8a">
    <link rel="apple-touch-icon" href="https://pbjwqhfzsvdougeksztq.supabase.co/storage/v1/object/public/public-img/icone-192.png">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border-t-4 border-gray-800">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-gray-800">Acesso ao Sistema</h2>
            <p class="text-sm text-gray-500 mt-2">Plataforma de Gestão de Terreiros</p>
        </div>

        <form id="formLogin" class="space-y-5">
            <!-- Campo de Identificação -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Identificação (ID ou WhatsApp)</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-user text-gray-400"></i>
                    </div>
                    <!-- Voltando ao numérico com inputmode! -->
                    <input type="tel" id="identificacao" required inputmode="numeric" pattern="[0-9]*"
                        class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-gray-800 focus:border-transparent transition"
                        placeholder="ID (1º Acesso) ou WhatsApp">
                </div>
                <div class="flex justify-between items-center mt-1">
                    <p class="text-xs text-gray-500">Primeiro acesso? Digite o ID.</p>
                    <button type="button" id="btnModoMaster" class="text-xs text-blue-600 font-bold hover:underline transition outline-none">Acesso Admin</button>
                </div>
            </div>

            <!-- Campo de Senha -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Senha</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-lock text-gray-400"></i>
                    </div>
                    <!-- Inputmode numeric travando teclado de números -->
                    <input type="password" id="senha" required inputmode="numeric" pattern="[0-9]*"
                        class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-gray-800 focus:border-transparent transition"
                        placeholder="Sua senha numérica">
                </div>
            </div>

            <button type="submit" id="btnEntrar"
                class="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-all flex justify-center items-center">
                <i class="fas fa-sign-in-alt mr-2"></i>
                <span>Entrar no Sistema</span>
            </button>
        </form>

        <div id="msgErro" class="mt-4 hidden p-3 rounded-lg bg-red-100 text-red-800 text-sm font-bold text-center border-l-4 border-red-600">
        </div>
        
        <div class="mt-6 text-center">
            <p class="text-xs text-gray-400">Desenvolvido para gestão eficiente de casas de axé.</p>
        </div>
    </div>

    <script src="js/supabase.js"></script>
    <script src="js/login.js"></script>
    
    <!-- Script Ativador do Service Worker (PWA) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('PWA Instalador Registrado!'))
            .catch(err => console.log('Erro no PWA:', err));
        });
      }
    </script>
</body>
</html>
