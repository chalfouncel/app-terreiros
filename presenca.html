<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presença - Terreiro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --cor-primaria: #1e3a8a;   
            --cor-secundaria: #16a34a; 
            --cor-fundo: #f3f4f6;      
            --cor-texto: #1f2937;      
        }
        
        body { 
            background-color: var(--cor-fundo); 
            transition: background-color 0.3s ease; 
        }

        .border-tema-primaria { border-color: var(--cor-primaria) !important; }
        .text-tema-texto { color: var(--cor-texto) !important; }
        .text-tema-primaria { color: var(--cor-primaria) !important; }
        .bg-tema-secundaria { background-color: var(--cor-secundaria) !important; }
        .focus-ring-tema { 
            --tw-ring-color: var(--cor-secundaria) !important; 
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
    
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md text-center border-t-4 border-tema-primaria relative z-10">
        
        <div class="flex justify-center mb-4">
            <img id="logoCasa" src="" alt="Logo da Casa" class="hidden h-20 object-contain">
        </div>

        <h2 class="text-2xl font-bold text-tema-texto mb-2">Check-in da Gira</h2>
        <div id="infoGira" class="text-gray-600 mb-6 font-medium text-lg">Buscando gira de hoje...</div>
        
        <div id="containerImagemGira" class="hidden w-full mb-6 rounded-lg overflow-hidden shadow-md">
            <img id="imgGira" src="" alt="Arte da Gira" class="w-full h-auto object-cover max-h-72">
        </div>
        
        <div id="containerBotoes" class="hidden w-full flex-col gap-3">
            <button id="btnPresenca" class="w-full flex items-center justify-center py-3 px-4 border border-transparent rounded-xl shadow-md text-lg font-bold text-white bg-tema-secundaria hover:opacity-90 focus:outline-none focus:ring-4 focus-ring-tema transition-all transform hover:scale-105 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                <i class="fas fa-map-marker-alt mr-2 text-xl"></i>
                Registrar Presença
            </button>

            <button id="btnAbrirDoacao" class="w-full flex items-center justify-center py-3 px-4 border-2 border-tema-primaria rounded-xl shadow-sm text-lg font-bold text-tema-primaria bg-white hover:bg-gray-50 focus:outline-none transition-all transform hover:scale-105 active:scale-95">
                <i class="fas fa-heart text-red-500 mr-2 text-xl"></i>
                Fazer uma Doação
            </button>
        </div>

        <div id="msgStatus" class="mt-6 text-sm font-semibold rounded p-3 hidden"></div>
    </div>

    <!-- Modal de Doação -->
    <div id="modalDoacao" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 z-50 transition-opacity">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 text-center transform scale-95 transition-all flex flex-col max-h-[90vh]">
            
            <div class="flex-shrink-0">
                <div class="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-3 shadow-sm">
                    <i class="fas fa-hands-holding-heart text-2xl text-red-500"></i>
                </div>
                <h3 class="text-xl font-bold text-gray-800 mb-1">Apoie nossa Casa</h3>
                <p class="text-gray-600 mb-4 text-xs">Sua contribuição fortalece a nossa corrente.</p>

                <div class="bg-gray-100 p-3 rounded-xl mb-4 relative border border-gray-200">
                    <p class="text-[10px] text-gray-500 font-bold uppercase mb-1">Doação Livre (PIX)</p>
                    <p id="chavePix" class="text-base font-mono font-bold text-gray-800 break-all">ciccantinho@gmail.com</p>
                    <button id="btnCopiarPix" class="mt-2 w-full bg-gray-800 text-white font-bold py-2 px-4 rounded-lg hover:bg-gray-700 transition flex items-center justify-center shadow-sm active:scale-95 text-sm">
                        <i class="fas fa-copy mr-2"></i> Copiar Chave
                    </button>
                </div>
                
                <h4 class="font-bold text-gray-700 mb-2 border-b pb-1 text-sm text-left">Ou escolha itens para doar:</h4>
            </div>

            <!-- Lista de Itens Dinâmica (Scrollável) -->
            <div class="flex-1 overflow-y-auto text-left mb-4 pr-1 space-y-1" id="listaItensDoacao">
                <p class="text-center text-gray-500 text-sm py-4"><i class="fas fa-spinner fa-spin mr-2"></i> Carregando itens...</p>
            </div>

            <!-- Botões Inferiores -->
            <div class="flex-shrink-0 pt-2 border-t border-gray-100">
                <button id="btnConfirmarDoacao" class="hidden w-full bg-green-600 text-white font-bold py-3 px-4 rounded-xl hover:bg-green-700 transition flex items-center justify-center shadow-md active:scale-95 mb-3">
                    <i class="fas fa-check-circle mr-2"></i> Registrar Doação (<span id="qtdTotalDoacao">0</span>)
                </button>

                <button id="btnFecharDoacao" class="w-full text-gray-500 font-semibold hover:text-gray-800 transition p-2 uppercase text-xs tracking-wider">
                    Voltar
                </button>
            </div>
        </div>
    </div>

    <script src="js/supabase.js"></script>
    <script src="js/presenca.js"></script>
</body>
</html>
