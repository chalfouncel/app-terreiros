<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presença - Terreiro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* Define as cores padrão neutras. Elas serão sobrescritas pelo JS na hora que logar */
        :root {
            --cor-primaria: #1e3a8a;   
            --cor-secundaria: #16a34a; 
            --cor-fundo: #f3f4f6;      
            --cor-texto: #1f2937;      
        }
        
        body { 
            background-color: var(--cor-fundo); 
            transition: background-color 0.3s ease; 
        }

        .border-tema-primaria { border-color: var(--cor-primaria) !important; }
        .text-tema-texto { color: var(--cor-texto) !important; }
        .text-tema-primaria { color: var(--cor-primaria) !important; }
        .bg-tema-secundaria { background-color: var(--cor-secundaria) !important; }
        .focus-ring-tema { 
            --tw-ring-color: var(--cor-secundaria) !important; 
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
    
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md text-center border-t-4 border-tema-primaria">
        
        <!-- Logo da Casa (Fica escondida até o JS puxar do banco) -->
        <div class="flex justify-center mb-4">
            <img id="logoCasa" src="" alt="Logo da Casa" class="hidden h-20 object-contain">
        </div>

        <h2 class="text-2xl font-bold text-tema-texto mb-2">Check-in da Gira</h2>
        <div id="infoGira" class="text-gray-600 mb-6 font-medium text-lg">Buscando gira de hoje...</div>
        
        <!-- Bloco Oculto para a Imagem da Gira -->
        <div id="containerImagemGira" class="hidden w-full mb-6 rounded-lg overflow-hidden shadow-md">
            <img id="imgGira" src="" alt="Arte da Gira" class="w-full h-auto object-cover max-h-72">
        </div>
        
        <!-- Container dos Botões -->
        <div class="flex flex-col space-y-4 mt-2">
            
            <!-- Botão Reduzido (Cor Secundária) -->
            <button id="btnPresenca" class="hidden w-full flex flex-row items-center justify-center py-3 px-4 border border-transparent rounded-xl shadow-md text-base font-bold text-white bg-tema-secundaria hover:opacity-90 focus:outline-none focus:ring-2 focus-ring-tema transition-all transform hover:scale-105 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
                Registrar Presença
            </button>

            <!-- Botão de Doações (Contorno Cor Primária) -->
            <button id="btnDoacao" onclick="document.getElementById('modalDoacao').classList.toggle('hidden')" class="w-full flex flex-row items-center justify-center py-3 px-4 border-2 border-tema-primaria rounded-xl shadow-sm text-base font-bold text-tema-primaria bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all transform hover:scale-105 active:scale-95">
                <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                </svg>
                Fazer uma Doação
            </button>
            
        </div>

        <!-- Painel Simples de Doação Oculto (Abre ao clicar) -->
        <div id="modalDoacao" class="hidden mt-4 p-5 bg-gray-50 border border-gray-200 rounded-xl text-left shadow-inner transition-all">
            <h3 class="text-sm font-bold text-gray-800 mb-1">Chave PIX da Casa:</h3>
            <p class="text-xs text-gray-600 mb-3">Sua ajuda é fundamental para a manutenção da nossa casa. Toda contribuição é bem-vinda!</p>
            <div class="flex items-center justify-between bg-white p-3 border border-gray-300 rounded-lg shadow-sm">
                <!-- Troque esse CNPJ/Telefone pelo PIX real da casa depois -->
                <span class="font-mono text-sm text-gray-800 font-bold select-all">12.345.678/0001-90</span>
                <button onclick="navigator.clipboard.writeText('12.345.678/0001-90'); alert('Chave PIX copiada!')" class="text-tema-primaria hover:opacity-70" title="Copiar PIX">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                </button>
            </div>
        </div>

        <div id="msgStatus" class="mt-6 text-sm font-semibold rounded p-3 hidden"></div>
    </div>

    <script src="js/supabase.js"></script>
    <script src="js/presenca.js"></script>
</body>
</html>
