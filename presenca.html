<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Terreiros - Presença</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- Cabeçalho (Navbar) -->
    <nav class="bg-amber-700 text-white p-4 shadow-md flex justify-between items-center">
        <div class="font-bold text-xl" id="nomeTerreiro">Carregando...</div>
        <button id="logoutBtn" class="text-sm bg-red-600 hover:bg-red-700 px-3 py-1 rounded">Sair</button>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-lg shadow-md w-full max-w-md text-center">
            
            <h2 class="text-2xl font-bold text-gray-800 mb-2" id="nomeUsuario">Olá, Médium</h2>
            <p class="text-gray-500 mb-6">Controle de Presença</p>

            <!-- Card do Evento de Hoje -->
            <div id="eventoHoje" class="bg-amber-50 p-4 rounded-md border border-amber-200 mb-6 hidden">
                <h3 class="font-bold text-amber-800 text-lg" id="tituloEvento">Nome do Evento</h3>
                <p class="text-sm text-amber-600" id="tipoEvento">Tipo</p>
                <p class="text-sm text-amber-600 font-semibold mt-2" id="horarioEvento">00:00</p>
            </div>

            <div id="semEvento" class="bg-gray-50 p-4 rounded-md border border-gray-200 mb-6 hidden">
                <p class="text-gray-500">Nenhum evento agendado para hoje.</p>
            </div>

            <!-- Botão de Ação -->
            <button id="btnPresenca" disabled class="w-full py-4 px-4 border border-transparent rounded-md shadow-sm text-lg font-bold text-white bg-gray-400 cursor-not-allowed transition-colors duration-200">
                Aguardando localização...
            </button>

            <!-- Mensagens de Status -->
            <div id="statusMessage" class="mt-4 text-sm font-medium hidden"></div>

        </div>
    </main>

    <!-- Scripts -->
    <script src="js/supabase.js"></script>
    <script src="js/presenca.js"></script>
</body>
</html>
