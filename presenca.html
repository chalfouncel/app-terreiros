<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presença - Terreiro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* Define as cores padrão neutras. Elas serão sobrescritas pelo JS na hora que logar */
        :root {
            --cor-primaria: #1e3a8a;   
            --cor-secundaria: #16a34a; 
            --cor-fundo: #f3f4f6;      
            --cor-texto: #1f2937;      
        }
        
        body { 
            background-color: var(--cor-fundo); 
            transition: background-color 0.3s ease; 
        }

        .border-tema-primaria { border-color: var(--cor-primaria) !important; }
        .text-tema-texto { color: var(--cor-texto) !important; }
        .text-tema-primaria { color: var(--cor-primaria) !important; }
        .bg-tema-secundaria { background-color: var(--cor-secundaria) !important; }
        .focus-ring-tema { 
            --tw-ring-color: var(--cor-secundaria) !important; 
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
    
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md text-center border-t-4 border-tema-primaria">
        
        <!-- Logo da Casa (Fica escondida até o JS puxar do banco) -->
        <div class="flex justify-center mb-4">
            <img id="logoCasa" src="" alt="Logo da Casa" class="hidden h-20 object-contain">
        </div>

        <h2 class="text-2xl font-bold text-tema-texto mb-2">Check-in da Gira</h2>
        <div id="infoGira" class="text-gray-600 mb-6 font-medium text-lg">Buscando gira de hoje...</div>
        
        <!-- Bloco Oculto para a Imagem da Gira -->
        <div id="containerImagemGira" class="hidden w-full mb-6 rounded-lg overflow-hidden shadow-md">
            <img id="imgGira" src="" alt="Arte da Gira" class="w-full h-auto object-cover max-h-72">
        </div>
        
        <!-- O Botão usa a Cor Secundária -->
        <button id="btnPresenca" class="hidden w-full flex flex-col items-center justify-center py-6 px-4 border border-transparent rounded-2xl shadow-lg text-xl font-bold text-white bg-tema-secundaria hover:opacity-90 focus:outline-none focus:ring-4 focus-ring-tema transition-all transform hover:scale-105 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
            <svg class="w-12 h-12 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
            Registrar Presença
        </button>

        <div id="msgStatus" class="mt-6 text-sm font-semibold rounded p-3 hidden"></div>
    </div>

    <script src="js/supabase.js"></script>
    <script src="js/presenca.js"></script>
</body>
</html>
